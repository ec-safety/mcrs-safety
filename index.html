<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Safety DC Montecristi</title>

<style>
:root{
  /* Colores inspirados en el logo de Montecristi */
  --navy-950:#020f20;
  --navy-900:#061b33;
  --navy-850:#082440;
  --navy-800:#0a2a4d;
  --navy-700:#032d5d;

  --gold:#f2b51d;
  --gold-soft:#f7d36b;
  --gold-light:#fff0a8;

  --sky:#9ed0ed;
  --sky-soft:#dceffa;

  --text:#f7fbff;
  --text-soft:rgba(220,239,250,.76);

  --panel:rgba(7,39,74,.78);
  --panel-strong:rgba(8,43,79,.92);
  --line:rgba(158,208,237,.20);
  --line-strong:rgba(158,208,237,.34);

  --shadow:0 16px 40px rgba(0,13,29,.36);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
  margin:0;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  color:var(--text);
  background:
    radial-gradient(
      900px 480px at 12% -5%,
      rgba(242,181,29,.16),
      transparent 58%
    ),
    radial-gradient(
      800px 460px at 92% 0%,
      rgba(158,208,237,.16),
      transparent 56%
    ),
    linear-gradient(
      180deg,
      var(--navy-950) 0%,
      var(--navy-900) 45%,
      var(--navy-850) 100%
    );
  overflow:hidden;
}

/* ===== APP ===== */
.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:14px;
  gap:14px;
}

/* ===== TOP ===== */
.top{
  position:relative;
  min-height:92px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    linear-gradient(
      135deg,
      rgba(10,50,91,.94),
      rgba(4,28,54,.88)
    );
  backdrop-filter:blur(12px);
  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
}

.top::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:0;
  height:2px;
  border-radius:10px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(242,181,29,.70),
    rgba(158,208,237,.55),
    transparent
  );
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
  min-width:0;
}

.logo{
  width:76px;
  height:76px;
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(220,239,250,.92)
    );
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(158,208,237,.55);
  box-shadow:
    0 0 0 4px rgba(158,208,237,.08),
    0 10px 24px rgba(0,0,0,.24);
  flex-shrink:0;
}

.logo img{
  width:92%;
  height:92%;
  object-fit:contain;
}

.brand-text{
  min-width:0;
}

.brand-kicker{
  margin-bottom:4px;
  font-size:11px;
  letter-spacing:1.8px;
  font-weight:900;
  color:var(--gold-soft);
  text-transform:uppercase;
}

.brand-title{
  margin:0;
  font-size:24px;
  font-weight:900;
  line-height:1.05;
  color:var(--text);
  letter-spacing:.3px;
}

.brand-subtitle{
  margin-top:6px;
  font-size:12px;
  color:var(--sky-soft);
  font-weight:600;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:290px 1fr;
  gap:14px;
}

/* ===== SIDEBAR ===== */
.sidebar{
  min-height:0;
  padding:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    linear-gradient(
      180deg,
      rgba(8,43,79,.92),
      rgba(4,28,54,.82)
    );
  backdrop-filter:blur(12px);
  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-y:auto;
}

.sidebar-title{
  margin:2px 2px 8px;
  font-size:12px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--gold-soft);
}

.btn{
  position:relative;
  width:100%;
  padding:13px 14px;
  border-radius:16px;
  border:1px solid rgba(158,208,237,.12);
  background:
    linear-gradient(
      180deg,
      rgba(158,208,237,.08),
      rgba(255,255,255,.025)
    );
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  transition:all .22s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}

.btn::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:4px;
  border-radius:10px;
  background:transparent;
  transition:all .22s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(158,208,237,.34);
  background:
    linear-gradient(
      180deg,
      rgba(158,208,237,.14),
      rgba(255,255,255,.04)
    );
}

.btn.active{
  border-color:rgba(242,181,29,.52);
  background:
    linear-gradient(
      135deg,
      rgba(242,181,29,.18),
      rgba(158,208,237,.08)
    );
  box-shadow:
    0 0 0 1px rgba(242,181,29,.10),
    0 10px 22px rgba(0,13,29,.30);
}

.btn.active::before{
  background:
    linear-gradient(
      180deg,
      var(--gold),
      var(--gold-light)
    );
  box-shadow:0 0 10px rgba(242,181,29,.52);
}

.btn-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  background:rgba(158,208,237,.10);
  border:1px solid rgba(158,208,237,.16);
  flex-shrink:0;
}

.btn.active .btn-icon{
  background:rgba(242,181,29,.14);
  border-color:rgba(242,181,29,.28);
}

.btn-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.2px;
}

/* ===== VIEWER ===== */
.viewer-wrap{
  min-height:0;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    linear-gradient(
      180deg,
      rgba(8,43,79,.92),
      rgba(4,28,54,.82)
    );
  backdrop-filter:blur(12px);
  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.04);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.viewer-head{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6px 0 4px;
}

.viewer-title{
  font-size:13px;
  font-weight:800;
  color:var(--sky-soft);
  letter-spacing:.4px;
}

.viewer-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:
    0 0 0 4px rgba(242,181,29,.08),
    0 0 14px rgba(242,181,29,.75);
}

.viewer{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border-radius:16px;
  background:#ffffff;
  border:1px solid rgba(158,208,237,.24);
  box-shadow:0 8px 24px rgba(0,13,29,.26);
}

iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

/* ===== FOOTER ===== */
.footer{
  min-height:48px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      rgba(8,43,79,.88),
      rgba(4,28,54,.80)
    );
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.footer img{
  height:24px;
  opacity:.94;
}

.footer-text{
  font-size:11px;
  color:var(--text-soft);
  font-weight:600;
}

/* ===== SCROLL ===== */
.sidebar::-webkit-scrollbar{
  width:8px;
  height:8px;
}

.sidebar::-webkit-scrollbar-track{
  background:rgba(255,255,255,.03);
  border-radius:10px;
}

.sidebar::-webkit-scrollbar-thumb{
  background:rgba(158,208,237,.24);
  border-radius:10px;
}

.sidebar::-webkit-scrollbar-thumb:hover{
  background:rgba(242,181,29,.36);
}

/* ===== RESPONSIVE ===== */
@media (max-width:980px){
  body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100dvh;
  }

  .main{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }

  .sidebar{
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
  }

  .sidebar-title{
    display:none;
  }

  .btn{
    min-width:210px;
    flex-shrink:0;
  }

  .brand-title{
    font-size:20px;
  }

  .brand-subtitle{
    font-size:11px;
  }
}

@media (max-width:600px){
  .app{
    padding:8px;
    gap:8px;
  }

  .top{
    min-height:78px;
    padding:10px 12px;
    border-radius:16px;
  }

  .logo{
    width:58px;
    height:58px;
    border-radius:14px;
  }

  .brand{
    gap:10px;
  }

  .brand-kicker{
    font-size:9px;
    letter-spacing:1.2px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-subtitle{
    font-size:10px;
  }

  .sidebar,
  .viewer-wrap,
  .footer{
    border-radius:16px;
  }
}
</style>
